name: Publicar no GitHub Pages

# Publica a cada push na master. Também dá para rodar manualmente (Actions → Run workflow).
# Requer Settings → Pages com a fonte "GitHub Actions".
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # O site é estático e não tem build: publica só o que o app usa.
      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg sw.js src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

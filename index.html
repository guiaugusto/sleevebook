<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12141b">
<title>Sleevebook</title>
<link rel="stylesheet" href="src/css/app.css">
</head>
<body>
<header class="top">
  <h1 id="title">Sleevebook</h1>
  <span class="stat" id="stat"></span>
  <button id="btnSettings" type="button">⚙ Configurar</button>
  <button id="btnExport" type="button">Exportar</button>
  <button id="btnImport" type="button">Importar</button>
  <input type="file" id="fileImport" accept="application/json" hidden>
</header>

<main id="stage" aria-label="Álbum"><div id="book"></div></main>

<nav class="pager" aria-label="Páginas">
  <button id="first" type="button" title="Primeira página">⏮</button>
  <button id="prev" type="button" title="Anterior (←)">◀</button>
  <span id="pos" class="stat" aria-live="polite"></span>
  <input type="number" id="jump" min="1" placeholder="Ir p/ pág." aria-label="Ir para a página">
  <button id="next" type="button" title="Próxima (→)">▶</button>
  <button id="last" type="button" title="Última página">⏭</button>
</nav>

<!-- Configurar álbum -->
<dialog id="dlgSet">
  <form method="dialog" id="formSet">
    <h2>Configurar álbum</h2>
    <label for="sName">Nome</label><input id="sName" maxlength="60">
    <div class="row">
      <div><label for="sRows">Linhas</label><input type="number" id="sRows" min="1" max="6"></div>
      <div><label for="sCols">Colunas</label><input type="number" id="sCols" min="1" max="6"></div>
      <div><label for="sPages">Páginas</label><input type="number" id="sPages" min="1" max="500"></div>
    </div>
    <div class="presets" id="presets"></div>
    <p class="hint" id="sInfo"></p>
    <label>Cor do álbum</label>
    <div id="colorPicker"></div>
    <div class="actions">
      <button type="button" id="sCancel">Cancelar</button>
      <button class="primary" id="sSave" value="save">Aplicar</button>
    </div>
  </form>
</dialog>

<!-- Cadastro de carta -->
<dialog id="dlgCard">
  <form method="dialog" id="formCard">
    <h2 id="cardTitle">Carta</h2>
    <label for="cName">Nome da carta</label><input id="cName" required maxlength="100">
    <div class="row">
      <div><label for="cSet">Coleção / set</label><input id="cSet" maxlength="80"></div>
      <div><label for="cNum">Número</label><input id="cNum" placeholder="4/102" maxlength="20"></div>
    </div>
    <div class="row">
      <div><label for="cCond">Condição</label><select id="cCond"></select></div>
      <div><label for="cQty">Quantidade</label><input type="number" id="cQty" min="1" value="1"></div>
      <div><label for="cPrice">Preço (US$)</label><input type="number" id="cPrice" min="0" step="0.01" placeholder="opcional"></div>
    </div>
    <label for="cImg">Imagem (URL)</label><input id="cImg" placeholder="https://...">
    <label for="cFile">…ou enviar foto/scan</label><input type="file" id="cFile" accept="image/*">
    <div class="preview" id="cPrev" role="img" aria-label="Prévia da carta"></div>
    <label for="cNotes">Notas</label><textarea id="cNotes" rows="2" maxlength="500"></textarea>
    <div class="actions">
      <button type="button" class="danger" id="cDel">Remover</button>
      <button type="button" id="cCancel">Cancelar</button>
      <button class="primary" id="cSave" value="save">Salvar</button>
    </div>
  </form>
</dialog>

<!-- Importar backup -->
<dialog id="dlgImport">
  <form method="dialog">
    <h2>Importar backup</h2>
    <p id="impInfo"></p>
    <p class="hint"><b>Mesclar</b> mantém o que você já tem e adiciona o backup. <b>Substituir</b> apaga tudo e usa só o backup.</p>
    <div class="actions">
      <button type="button" id="impCancel">Cancelar</button>
      <button type="button" id="impMerge">Mesclar</button>
      <button type="button" class="danger" id="impReplace">Substituir</button>
    </div>
  </form>
</dialog>

<script type="module" src="src/js/app.js"></script>
</body>
</html>

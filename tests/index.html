<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes · Sleevebook</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;background:#fff;color:#161922}
  #summary{font-weight:700;margin:8px 0 16px}
  ul{list-style:none;padding:0}li{padding:3px 0}.pass{color:#1b7a4c}.fail{color:#b3261e;font-weight:600}
  @media(prefers-color-scheme:dark){body{background:#14161f;color:#e8eaf2}.pass{color:#4cc790}.fail{color:#ff8a7a}}
</style>
</head>
<body>
<h1>Testes</h1>
<div id="summary">rodando…</div>
<ul id="results"></ul>
<script type="module">
  import { runAll } from './run.js';
  // Cada arquivo de teste registra seus casos ao ser importado. Novos arquivos entram nesta lista.
  const files = ['color', 'grid', 'store', 'providers'];
  for (const f of files) await import(`./${f}.test.js`);
  await runAll();
</script>
</body>
</html>
